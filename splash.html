<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeepSeek Harness</title>
<style>
  /* 视觉规范取自 www.deepseek.com/harness:深黑底 + 品牌蓝流动渐变 + 90px 网格 + hero 入场 */
  :root {
    --ink: #0a0a0a;        /* 官网页底色 */
    --fg: #f5f5f5;         /* 官网暗色主题前景 */
    --muted: #8b93a1;
    --brand: #4d6bfe;      /* 官网 --ds-color-brand(亮) */
    --brand-2: #6799fe;    /* 官网暗色品牌蓝 */
    --warn: #d29922;
    --mono: Consolas, "Cascadia Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--ink);
    font-family: Bahnschrift, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-app-region: no-drag;
    color: var(--fg);
  }

  /* z-0 流动渐变层(对应官网 #gradient-canvas:就绪后 1.5s 淡入) */
  #gradient { position: fixed; inset: 0; display: block; opacity: 0; }
  #gradient.loaded { opacity: 1; transition: opacity 1.5s ease-in 50ms; }

  /* z-[1] 网格线层(官网 .ds-grid-bg:90px 网格,边缘 mask 渐隐;暗色用白线) */
  .grid {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image: linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 0),
                      linear-gradient(rgba(255,255,255,.028) 1px, transparent 0);
    background-size: 90px 90px;
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 0, #000 78%);
            mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 0, #000 78%);
  }

  /* z-10 hero 内容:官网 ds-hero-enter(0.8s 上浮 + 模糊消散) */
  .hero {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px;
  }
  .ds-hero-enter { animation: .8s ease-out 0s 1 normal backwards running ds-hero-enter; }
  @keyframes ds-hero-enter {
    0%   { opacity: 0; transform: translateY(20px); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0px);  filter: blur(0); }
  }
  /* [T10] 粒子鲸鱼画布:居中于 hero,替代静态 SVG;交互由粒子引擎驱动 */
  #whaleParticles {
    width: clamp(300px, 44vw, 440px);
    height: clamp(170px, 25vw, 250px);
    filter: drop-shadow(0 0 34px rgba(77,107,254,.35));
  }
  .wordmark { width: clamp(200px, 30vw, 280px); color: var(--fg); opacity: .92; }
  .hero .ds-hero-enter:nth-child(2) { animation-delay: .12s; }

  /* 底部阶段图注 + 进度条 */
  .cap {
    position: fixed; left: 0; right: 0; bottom: 12px; z-index: 10;
    text-align: center; font-size: 11px; letter-spacing: .12em; color: var(--muted);
    transition: color .3s;
  }
  .meta {
    position: fixed; top: 10px; right: 14px; z-index: 10;
    font-family: var(--mono); font-size: 10px;
    color: rgba(214, 224, 255, .32); letter-spacing: .05em;
  }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; z-index: 10;
         background: rgba(160, 180, 255, .08); }
  .fill {
    height: 100%; width: 8%;
    background: linear-gradient(90deg, #2b46e8, var(--brand) 55%, #9db4ff);
    box-shadow: 0 0 10px rgba(77, 107, 254, .6);
    transition: width 1.1s cubic-bezier(.25, .6, .25, 1), background .3s, box-shadow .3s;
  }
  body.crash .fill {
    background: linear-gradient(90deg, #8a6416, var(--warn) 55%, #f0d488);
    box-shadow: 0 0 10px rgba(210, 153, 34, .55);
  }
  body.crash .cap { color: var(--warn); }
</style>
</head>
<body>
  <canvas id="gradient"></canvas>
  <div class="grid"></div>
  <div class="hero">
    <canvas id="whaleParticles" class="ds-hero-enter"></canvas>
    <div class="ds-hero-enter wordmark" id="wordmark"></div>
  </div>
  <div class="cap ds-hero-enter" id="stage">正在启动…</div>
  <div class="meta" id="meta"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
<script src="whale-data.js"></script>
<script>
  // ---------- 官网 wordmark 注入 ----------
  document.getElementById('wordmark').innerHTML = window.DSH_LOGO_SVG || ''

  // ---------- [T10] 粒子鲸鱼:SVG 点云采样 + 弹簧聚合 + 鼠标散开 ----------
  // 官网鲸鱼 logo 离屏栅格化 → alpha 采样成 ~2400 个粒子(≤3000 上限);
  // 每粒子受 home 弹簧力(聚合)、鼠标斥力(散开)、微弱噪声漂移(呼吸);
  // 入场时从随机散布态收敛成鲸形。2D canvas 渲染,启动期 CPU/GPU 占用可控。
  ;(function () {
    var canvas = document.getElementById('whaleParticles')
    var ctx = canvas.getContext('2d')
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5)
    var W = 0, H = 0
    var particles = []
    var mouse = { x: -1e4, y: -1e4 }
    var MAX_PARTICLES = 2600
    var readyT = 0 // 入场收敛进度(0→1)

    function resize() {
      var r = canvas.getBoundingClientRect()
      W = r.width; H = r.height
      canvas.width = Math.round(W * dpr)
      canvas.height = Math.round(H * dpr)
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    }

    // 离屏渲染鲸鱼 SVG → 按 alpha 采样 home 点
    function sampleWhale(cb) {
      var svg = window.DSH_WHALE_SVG
      if (!svg) return cb([])
      var img = new Image()
      img.onload = function () {
        var sw = 400, sh = Math.round(sw * img.height / img.width) || 220
        var off = document.createElement('canvas')
        off.width = sw; off.height = sh
        var octx = off.getContext('2d')
        octx.drawImage(img, 0, 0, sw, sh)
        var data
        try { data = octx.getImageData(0, 0, sw, sh).data } catch (e) { return cb([]) }
        // 收集候选像素(alpha 足够深),再均匀抽到目标数量
        var cand = []
        for (var y = 0; y < sh; y += 2) {
          for (var x = 0; x < sw; x += 2) {
            var a = data[(y * sw + x) * 4 + 3]
            if (a > 96) cand.push([x, y])
          }
        }
        var n = Math.min(cand.length, MAX_PARTICLES)
        var pts = []
        var step = cand.length / Math.max(1, n)
        for (var i = 0; i < n; i++) {
          var p = cand[Math.floor(i * step)]
          pts.push(p)
        }
        cb(pts)
      }
      img.onerror = function () { cb([]) }
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)))
    }

    function initParticles(pts) {
      resize()
      var r = canvas.getBoundingClientRect()
      // home 点云缩放到画布(留 8% 边距)
      var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9
      for (var i = 0; i < pts.length; i++) {
        minX = Math.min(minX, pts[i][0]); maxX = Math.max(maxX, pts[i][0])
        minY = Math.min(minY, pts[i][1]); maxY = Math.max(maxY, pts[i][1])
      }
      var pad = .08
      var kx = W * (1 - pad * 2) / Math.max(1, (maxX - minX))
      var ky = H * (1 - pad * 2) / Math.max(1, (maxY - minY))
      var k = Math.min(kx, ky)
      var ox = (W - (maxX - minX) * k) / 2
      var oy = (H - (maxY - minY) * k) / 2
      particles = []
      for (var j = 0; j < pts.length; j++) {
        var hx = ox + (pts[j][0] - minX) * k
        var hy = oy + (pts[j][1] - minY) * k
        particles.push({
          hx: hx, hy: hy,
          // 入场:从画布外围随机散布态开始收敛
          x: Math.random() * W, y: Math.random() * H,
          vx: 0, vy: 0,
          s: .8 + Math.random() * 1.3,               // 粒径
          ph: Math.random() * 6.2832,                 // 噪声相位
          c: Math.random()                             // 色相插值系数
        })
      }
    }

    var t0 = performance.now()
    function frame(t) {
      var s = (t - t0) * .001
      readyT = Math.min(1, readyT + .016)
      ctx.clearRect(0, 0, W, H)
      // 整体呼吸浮动(替代原 SVG float 动画)
      var bobY = Math.sin(s * .9) * 4
      var bobR = Math.sin(s * .7) * .012
      ctx.globalCompositeOperation = 'lighter'
      var conv = readyT * readyT * (3 - 2 * readyT) // smoothstep 收敛强度
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i]
        // home 点加整体浮动
        var rx = p.hx - W / 2, ry = p.hy - H / 2
        var hx = W / 2 + rx * Math.cos(bobR) - ry * Math.sin(bobR)
        var hy = H / 2 + rx * Math.sin(bobR) + ry * Math.cos(bobR) + bobY
        // 弹簧回位(聚合)
        var ax = (hx - p.x) * (.028 + .10 * conv)
        var ay = (hy - p.y) * (.028 + .10 * conv)
        // 鼠标斥力(散开)
        var dx = p.x - mouse.x, dy = p.y - mouse.y
        var d2 = dx * dx + dy * dy
        if (d2 < 8100 && d2 > .01) { // 90px 半径
          var d = Math.sqrt(d2)
          var f = (90 - d) / 90 * 2.6
          ax += dx / d * f
          ay += dy / d * f
        }
        // 微弱噪声漂移(呼吸感)
        ax += Math.sin(s * 1.3 + p.ph) * .012
        ay += Math.cos(s * 1.1 + p.ph * 1.7) * .012
        p.vx = (p.vx + ax) * .88
        p.vy = (p.vy + ay) * .88
        p.x += p.vx
        p.y += p.vy
        // 着色:品牌蓝渐变(#2b46e8 → #6799fe),速度越快越亮
        var sp = Math.min(1, (Math.abs(p.vx) + Math.abs(p.vy)) * .25)
        var cr = Math.round(43 + p.c * 60 + sp * 40)
        var cg = Math.round(70 + p.c * 83 + sp * 30)
        var cb = Math.round(232 + p.c * 22)
        ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (.42 + p.c * .38 + sp * .2).toFixed(3) + ')'
        ctx.fillRect(p.x, p.y, p.s, p.s)
      }
      requestAnimationFrame(frame)
    }

    window.addEventListener('mousemove', function (ev) {
      var r = canvas.getBoundingClientRect()
      mouse.x = ev.clientX - r.left
      mouse.y = ev.clientY - r.top
    })
    window.addEventListener('resize', function () {
      // 重采样布局(窗口尺寸变化时按新画布尺寸重放 home 点)
      sampleWhale(function (pts) { if (pts.length) initParticles(pts) })
    })

    resize()
    sampleWhale(function (pts) {
      if (!pts.length) {
        // SVG 不可用兜底:环形粒子团
        pts = []
        for (var i = 0; i < 900; i++) {
          var a = Math.random() * 6.2832, rr = 60 + Math.random() * 60
          pts.push([200 + Math.cos(a) * rr * 1.8, 110 + Math.sin(a) * rr])
        }
      }
      initParticles(pts)
      requestAnimationFrame(frame)
    })
  })()

  // ---------- 官网 hero 背景效果:流动渐变(canvas 2D 逼近官网 WebGL 渐变) ----------
  var canvas = document.getElementById('gradient')
  var ctx = canvas.getContext('2d')
  var W = 0, H = 0

  var BLOBS = [
    { r: .58, c: '43,70,232',  a: .34, fx: .062, fy: .048, px: .0,  py: .2,  ox: .30, oy: .38 },
    { r: .50, c: '77,107,254', a: .30, fx: .045, fy: .061, px: .9,  py: .7,  ox: .68, oy: .30 },
    { r: .46, c: '13,22,48',   a: .55, fx: .030, fy: .026, px: .4,  py: .1,  ox: .55, oy: .62 },
    { r: .40, c: '103,153,254',a: .22, fx: .071, fy: .039, px: .25, py: .85, ox: .38, oy: .55 },
    { r: .34, c: '77,107,254', a: .20, fx: .052, fy: .075, px: .75, py: .35, ox: .78, oy: .72 },
  ]

  function resizeBg() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5)
    W = window.innerWidth; H = window.innerHeight
    canvas.width = Math.round(W * dpr)
    canvas.height = Math.round(H * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  }

  function frameBg(t) {
    var s = t * .001
    ctx.globalCompositeOperation = 'source-over'
    ctx.fillStyle = '#0a0a0a'
    ctx.fillRect(0, 0, W, H)
    ctx.globalCompositeOperation = 'lighter'
    for (var i = 0; i < BLOBS.length; i++) {
      var b = BLOBS[i]
      var cx = (b.ox + Math.sin(s * b.fx * 6.2832 + b.px * 6.2832) * .22) * W
      var cy = (b.oy + Math.cos(s * b.fy * 6.2832 + b.py * 6.2832) * .20) * H
      var rad = b.r * Math.max(W, H) * (1 + Math.sin(s * .18 + i * 1.7) * .12)
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad)
      g.addColorStop(0, 'rgba(' + b.c + ',' + b.a + ')')
      g.addColorStop(.55, 'rgba(' + b.c + ',' + (b.a * .38).toFixed(3) + ')')
      g.addColorStop(1, 'rgba(' + b.c + ',0)')
      ctx.fillStyle = g
      ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2)
    }
    ctx.globalCompositeOperation = 'source-over'
    var v = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .30, W / 2, H * .45, Math.max(W, H) * .78)
    v.addColorStop(0, 'rgba(10,10,10,0)')
    v.addColorStop(1, 'rgba(10,10,10,.72)')
    ctx.fillStyle = v
    ctx.fillRect(0, 0, W, H)
    requestAnimationFrame(frameBg)
  }

  window.addEventListener('resize', resizeBg)
  resizeBg()
  requestAnimationFrame(frameBg)
  canvas.classList.add('loaded')

  // ---------- 启动阶段 → 进度 ----------
  var STAGES = {
    probe: ['探测本地服务…', 10],
    spawn: ['启动 dsh 服务…', 24],
    wait: ['等待服务就绪(首次运行需下载依赖)…', 55],
    ready: ['即将进入', 100],
    crash: ['dsh 服务异常退出,正在自动恢复…', 12],
  }
  var elStage = document.getElementById('stage')
  var elFill = document.getElementById('fill')
  var bridge = window.dshDesktop // 壳 preload 注入;file:// 直开预览时缺省容错
  if (bridge && bridge.onStage) {
    bridge.onStage(function (name) {
      var s = STAGES[name]
      if (!s) return
      document.body.classList.toggle('crash', name === 'crash')
      elStage.textContent = s[0]
      elFill.style.width = s[1] + '%'
    })
  } else {
    // 预览模式:模拟阶段推进
    var seq = [['probe', 0], ['spawn', 700], ['wait', 1600], ['ready', 3200]]
    seq.forEach(function (it) {
      setTimeout(function () {
        var s = STAGES[it[0]]
        elStage.textContent = s[0]
        elFill.style.width = s[1] + '%'
      }, it[1])
    })
  }

  // 右上角版本信息
  if (bridge && bridge.settings) {
    bridge.settings.get().then(function (s) {
      document.getElementById('meta').textContent = 'dsh ' + s.dshVersion + ' · v' + s.shellVersion
    }).catch(function () { /* 版本读取失败不影响启动页 */ })
  }
</script>
</body>
</html>
